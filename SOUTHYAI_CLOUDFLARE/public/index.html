<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOUTHYAI — South African Language AI Data</title>
<link rel="icon" href="data:,">
<style>
:root{--p:#8b5cf6;--p2:#6d28d9;--ink:#172033;--muted:#667085;--bg:#f7f7fb;--card:#fff;--line:#e7e7ef;--green:#16a34a;--orange:#f59e0b;--red:#dc2626}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Inter,system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:1180px;margin:auto;min-height:100vh;padding-bottom:70px}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.logo{font-size:22px;font-weight:900;color:var(--p)}.logo b{color:var(--ink)}
.wrap{padding:24px}.hero{padding:44px 28px;background:linear-gradient(135deg,#fff,#f1ebff);border-radius:24px;margin-bottom:20px}.hero h1{font-size:clamp(34px,6vw,58px);line-height:1.03;margin:0 0 14px;max-width:780px}.hero p{font-size:17px;color:var(--muted);max-width:720px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 5px 20px #1111}.card h2,.card h3{margin:0 0 10px}.muted{color:var(--muted);line-height:1.5}.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--p);color:#fff;font-weight:750;cursor:pointer}.btn:hover{background:var(--p2)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:var(--red)}.btn.small{padding:8px 10px;font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}.grow{flex:1}.pill{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;background:#eee;color:#555}.active{background:#dcfce7;color:#166534}.soon{background:#ffedd5;color:#9a3412}.pending{background:#fef3c7;color:#92400e}.approved{background:#dcfce7;color:#166534}.rejected{background:#fee2e2;color:#991b1b}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;margin:5px 0 13px;background:#fff;font:inherit}label{font-size:13px;font-weight:700;color:#475467}.narrow{max-width:460px;margin:40px auto}.balance{font-size:38px;font-weight:900;color:var(--p)}.notice{padding:12px;border-radius:12px;background:#f4f3ff;margin:10px 0}.error{color:var(--red);font-weight:650}.success{color:var(--green);font-weight:650}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:8px;z-index:10}.nav button{border:0;background:transparent;padding:9px 12px;border-radius:10px;cursor:pointer}.nav button:hover{background:#f1effa}.hidden{display:none}.center{text-align:center}.rec{width:150px;height:150px;border-radius:50%;margin:22px auto;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;user-select:none;touch-action:none}.rec.on{background:var(--red);transform:scale(1.04)}.prompt{font-size:21px;font-weight:800;text-align:center;background:#f8f6ff;border-radius:16px;padding:28px}.score{font-size:28px;font-weight:900}.toast{position:fixed;right:18px;bottom:80px;background:#172033;color:#fff;padding:12px 16px;border-radius:12px;z-index:20}
@media(max-width:700px){.wrap{padding:14px}.top{padding:14px}.hero{padding:28px 18px}.nav{overflow:auto;justify-content:flex-start}}
</style></head><body><div id="app"></div>
<script>
const API="/api";
const MANAGERS=["lionbridgerewards2026@gmail.com","imizamomaquati88@gmail.com","thembelagwala@gmail.com"];
const LANGS=[["english_za","English (SA)"],["zulu","isiZulu"],["xhosa","isiXhosa"],["sotho","Sesotho"],["afrikaans","Afrikaans"],["tsonga","XiTsonga"],["venda","Tshivenda"],["tswana","Setswana"],["pedi","Sepedi"],["swati","siSwati"],["ndebele","isiNdebele"]];
const CATS=["banking","customer_service","tech_support","investments","troubleshooting"];
const state={token:localStorage.getItem("southy_token")||"",user:JSON.parse(localStorage.getItem("southy_user")||"null"),projects:[],current:null,session:null,prompt:null,blob:null,duration:0,quality:null,clips:0,earned:0};
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function money(n){return "$"+Number(n||0).toFixed(2)}
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
function go(hash){location.hash=hash}
async function api(path,opt={}){const h={...(opt.body instanceof FormData?{}:{"Content-Type":"application/json"}),...(state.token?{"Authorization":"Bearer "+state.token}:{})};const r=await fetch(API+path,{...opt,headers:{...h,...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok){const e=Error(d.error||"Request failed");e.code=d.code;if(d.code==="MFA_SETUP"&&location.hash!=="#mfa-setup")setTimeout(()=>go("#mfa-setup"),0);throw e}return d}
function topBar(title=""){return `<div class="top"><div class="logo">SOUTHY<b>AI</b></div><div>${title}</div></div>`}
function footer(){return `<div class="muted" style="text-align:center;padding:28px 16px 18px;font-size:12px;opacity:.65">© ${new Date().getFullYear()} SOUTHYAI. All rights reserved. SOUTHYAI.co.za</div>`}
function nav(active="dashboard"){if(!state.user)return "";return `<div class="nav">
<button onclick="go('#dashboard')">🏠 Dashboard</button><button onclick="go('#projects')">📋 Projects</button><button onclick="go('#referrals')">🎁 Referrals</button><button onclick="go('#transcription')">✍️ Transcription</button>${state.user.is_manager?'<button onclick="go(\'#admin\')">🛡️ Admin</button>':''}<button onclick="go('#account')">💰 Account</button><button onclick="logout()">↪ Logout</button></div>`}
function statusBadge(s){return `<span class="pill ${esc(s)}">${esc(s.replace("_"," "))}</span>`}
function projectCard(p){const pct=p.total_clips_needed?Math.min(100,Math.round(p.completed_clips/p.total_clips_needed*100)):0;return `<div class="card">
<div class="row"><span class="pill">${esc(p.category.replaceAll("_"," "))}</span>${p.status==="active"?'<span class="pill active">Active</span>':'<span class="pill soon">Coming Soon</span>'}</div>
<h3>${esc(p.name)}</h3><p class="muted">${esc(p.description)}</p><p><b>${money(p.hourly_rate_usd)}/hr</b> · ${p.total_prompts} prompts · ${esc((p.languages||[]).map(x=>(LANGS.find(y=>y[0]===x)||[,x])[1]).join(", "))}</p>
<div style="height:8px;background:#eee;border-radius:8px;overflow:hidden"><div style="width:${pct}%;height:100%;background:var(--p)"></div></div>
<p class="muted">${p.completed_clips||0}/${p.total_clips_needed||55} clips</p>
<button class="btn ${p.status==="active"?"":"alt"}" ${p.status==="active"?"":"disabled"} onclick="applyProject('${p.id}')">${p.status==="active"?"Apply":"Coming Soon"}</button>
</div>`}
async function loadProjects(){const d=await api("/projects");state.projects=d.projects||[];return state.projects}
function landing(){return `${topBar()}<div class="wrap"><section class="hero"><h1>Earn while helping build African-language AI.</h1><p>SOUTHYAI connects verified freelancers with voice and language-data projects across South Africa. Record clear prompts, pass quality checks, and earn hourly rates for approved work.</p><div class="row"><button class="btn" onclick="go('#signup')">Create freelancer account</button><button class="btn alt" onclick="go('#login')">Log in</button></div></section>
<div class="grid"><div class="card"><h3>1. Sign up</h3><p class="muted">Create your account and receive a personal SOUTH-XXXXXX referral code.</p></div><div class="card"><h3>2. Apply</h3><p class="muted">Browse active projects. Approved applications unlock recording work.</p></div><div class="card"><h3>3. Record</h3><p class="muted">Use a compatible smartphone or Windows 11 laptop with a suitable wired/USB microphone headset.</p></div><div class="card"><h3>4. Get paid</h3><p class="muted">Active projects pay $6/hr; coming-soon projects display $10/hr. Referral rewards are $3 per qualifying signup.</p></div></div>
<h2 style="margin-top:30px">55 projects · 3,025 prompts</h2><div id="landing-projects" class="grid"><div class="card">Loading projects…</div></div></div>`}
async function renderLandingProjects(){try{await loadProjects();document.getElementById("landing-projects").innerHTML=state.projects.map(projectCard).join("")}catch(e){document.getElementById("landing-projects").innerHTML=`<div class="card error">${esc(e.message)}</div>`}}
function signup(){return `${topBar()}<div class="wrap"><div class="card narrow"><h2>Create your account</h2><div id="err" class="error"></div><label>Full name</label><input id="name"><label>Email</label><input id="email" type="email"><label>Password</label><input id="pass" type="password" placeholder="Minimum 8 characters"><label>Home language</label><select id="lang">${LANGS.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join("")}</select><label>Referral code (optional)</label><input id="ref" placeholder="SOUTH-XXXXXX"><label><input id="terms" type="checkbox" style="width:auto"> I agree to the Terms & Conditions</label><label><input id="age" type="checkbox" style="width:auto"> I confirm I am 18 or older</label><button class="btn" onclick="signupDo()">Create Account</button><p class="muted center">Already registered? <a href="#login">Log in</a></p></div></div>`}
async function signupDo(){const err=document.getElementById("err");err.textContent="";const b={full_name:document.getElementById("name").value.trim(),email:document.getElementById("email").value.trim(),password:document.getElementById("pass").value,home_language:document.getElementById("lang").value,referral_code:document.getElementById("ref").value.trim()};if(!document.getElementById("terms").checked||!document.getElementById("age").checked){err.textContent="Please accept the terms and confirm your age.";return}try{const d=await api("/auth/signup",{method:"POST",body:JSON.stringify(b)});setAuth(d);go(d.user.is_manager?"#admin":"#dashboard")}catch(e){err.textContent=e.message}}
function login(){return `${topBar()}<div class="wrap"><div class="card narrow"><h2>Welcome back</h2><div id="err" class="error"></div><label>Email</label><input id="email" type="email"><label>Password</label><input id="pass" type="password"><div id="mfarow" style="display:none"><label>Authenticator code (or a recovery code)</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="12"></div><button class="btn" onclick="loginDo()">Log In</button><p class="muted center">New here? <a href="#signup">Create an account</a></p></div></div>`}
async function loginDo(){const err=document.getElementById("err");try{const d=await api("/auth/login",{method:"POST",body:JSON.stringify({email:document.getElementById("email").value.trim(),password:document.getElementById("pass").value,code:(document.getElementById("code")||{}).value||""})});setAuth(d);go(d.mfa_setup_required?"#mfa-setup":(d.user.is_manager?"#admin":"#dashboard"))}catch(e){if(e.code==="MFA_REQUIRED")document.getElementById("mfarow").style.display="block";err.textContent=e.message}}
function setAuth(d){state.token=d.token;state.user=d.user;localStorage.setItem("southy_token",d.token);localStorage.setItem("southy_user",JSON.stringify(d.user))}
function logout(){localStorage.removeItem("southy_token");localStorage.removeItem("southy_user");state.token="";state.user=null;go("#landing")}
async function dashboard(){let bal={balance_usd:0,total_earned_usd:0};let apps=[];try{bal=await api("/account/balance");apps=(await api("/applications")).applications||[]}catch(e){}try{await loadProjects()}catch(e){}const hasApproved=apps.some(a=>a.status==="approved");const contractBanner=(hasApproved&&!state.user.contract_signed)?`<div class="notice">✅ You've been approved! Before you can start recording and earning, please contact your SOUTHYAI admin to complete induction/training and sign your freelancer contract.</div>`:"";return `${topBar("Freelancer Dashboard")}<div class="wrap"><div class="hero"><div class="muted">Available balance</div><div class="balance">${money(bal.balance_usd)}</div><h2>Sawubona, ${esc(state.user.full_name.split(" ")[0])} 👋</h2><p>Approved projects unlock paid recording. Your referral code is <b>${esc(state.user.referral_code||"—")}</b>.</p></div>${contractBanner}
<div class="grid"><div class="card"><h3>Total earned</h3><div class="balance" style="font-size:25px">${money(bal.total_earned_usd)}</div></div><div class="card"><h3>Applications</h3><div class="balance" style="font-size:25px">${apps.length}</div></div><div class="card"><h3>Referrals</h3><button class="btn" onclick="go('#referrals')">Open referral centre</button></div></div>
<h2>My Applications</h2><div class="card tablewrap"><table class="table"><tr><th>Project</th><th>Rate</th><th>Status</th><th>Applied</th></tr>${apps.map(a=>`<tr><td>${esc(a.name)}</td><td>${money(a.hourly_rate_usd)}/hr</td><td>${statusBadge(a.status)}</td><td>${new Date(a.applied_at).toLocaleDateString()}</td></tr>`).join("")||"<tr><td colspan=4>No applications yet.</td></tr>"}</table></div></div>${nav("dashboard")}`}
async function projects(){try{await loadProjects()}catch(e){return `${topBar("Projects")}<div class="wrap"><div class="card error">${esc(e.message)}</div></div>${nav("projects")}`}return `${topBar("55 Projects")}<div class="wrap"><div class="hero"><h1>Projects</h1><p>35 active projects pay <b>$6/hr</b>. 20 coming-soon projects display <b>$10/hr</b> and cannot yet be applied for.</p></div><div class="row"><select id="cat" onchange="filter()"><option value="all">All categories</option>${CATS.map(c=>`<option>${c}</option>`).join("")}</select><select id="lng" onchange="filter()"><option value="all">All languages</option>${LANGS.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join("")}</select></div><div id="plist" class="grid">${state.projects.map(projectCard).join("")}</div></div>${nav("projects")}`}
async function filter(){try{const c=document.getElementById("cat").value,l=document.getElementById("lng").value;const d=await api(`/projects?category=${encodeURIComponent(c)}&language=${encodeURIComponent(l)}`);document.getElementById("plist").innerHTML=d.projects.map(projectCard).join("")||'<div class="card">No projects match.</div>'}catch(e){toast(e.message)}}
async function applyProject(id){if(!state.user){go("#login");return}try{const d=await api("/apply",{method:"POST",body:JSON.stringify({project_id:id})});toast(d.message||"Application submitted for QA");go("#dashboard")}catch(e){toast(e.message)}}
async function referrals(){let d={referral_code:"",referral_balance_usd:0,total_referrals:0,referrals:[]};try{d=await api("/referral")}catch(e){}return `${topBar("Referral Centre")}<div class="wrap"><div class="hero"><h1>Refer & earn $3</h1><p>Share your personal code. When a new user signs up with your code, the qualifying referral reward is credited to your balance.</p><div class="row"><input id="rcode" readonly value="${esc(d.referral_code)}"><button class="btn" onclick="copyReferral()">Copy code</button><button class="btn alt" onclick="shareReferral()">WhatsApp share</button></div></div><div class="grid"><div class="card"><h3>Referral balance</h3><div class="balance">${money(d.referral_balance_usd)}</div></div><div class="card"><h3>Total referrals</h3><div class="balance">${d.total_referrals}</div></div></div><div class="card"><h2>Referral history</h2><div class="tablewrap"><table class="table"><tr><th>Name</th><th>Email</th><th>Reward</th><th>Status</th><th>Date</th></tr>${d.referrals.map(r=>`<tr><td>${esc(r.full_name)}</td><td>${esc(r.email)}</td><td>${money(r.reward_usd)}</td><td>${statusBadge(r.status)}</td><td>${new Date(r.created_at).toLocaleDateString()}</td></tr>`).join("")||"<tr><td colspan=5>No referrals yet.</td></tr>"}</table></div></div></div>${nav("referrals")}`}
async function copyReferral(){await navigator.clipboard?.writeText(document.getElementById("rcode").value);toast("Referral code copied")}
function shareReferral(){const c=document.getElementById("rcode").value;const text=encodeURIComponent(`Join SOUTHYAI and earn from language-data projects. Use my referral code ${c} when you sign up.`);window.open(`https://wa.me/?text=${text}`,"_blank")}
async function projectDetail(id){try{await loadProjects()}catch(e){}const p=state.projects.find(x=>x.id===id);if(!p)return `${topBar("Project")}<div class="wrap"><div class="card error">Project not found.</div></div>`;state.current=p;return `${topBar(p.name)}<div class="wrap"><div class="hero"><span class="pill ${p.status==="active"?"active":"soon"}">${p.status==="active"?"Active":"Coming Soon"}</span><h1>${esc(p.name)}</h1><p>${esc(p.description)}</p><h2>${money(p.hourly_rate_usd)}/hr</h2><p class="muted">${p.total_prompts} prompts. Language: ${(p.languages||[]).map(x=>(LANGS.find(y=>y[0]===x)||[,x])[1]).join(", ")}</p></div>
<div class="grid"><div class="card"><h3>Equipment & technical requirements</h3><ul class="muted"><li><b>Device:</b> Windows 10/11 laptop or desktop, or a mid-range or newer smartphone (Android 10+ or iOS 14+)</li><li><b>Microphone:</b> USB microphone or a wired headset with built-in mic strongly preferred. Bluetooth headsets are not recommended — audio compression lowers quality. Built-in laptop/phone mics are allowed only if no external mic is available.</li><li><b>Browser:</b> Latest version of Chrome, Edge, Firefox or Safari — required for microphone access</li><li><b>Internet:</b> Stable connection, minimum ~5 Mbps upload recommended for smooth recording uploads</li><li><b>Recording space:</b> Quiet indoor room with no fridge, fan, TV, pets, traffic, music or other background noise</li><li><b>Clip length:</b> Each recording is 1–15 seconds per script line</li></ul></div><div class="card"><h3>AI audio quality checker</h3><p class="muted">Every recording receives a browser-side signal/silence/clipping quality score before upload. Clips that fail are sent back for re-recording; final QA can still review.</p></div></div>
${p.status==="active"?`<button class="btn" onclick="applyProject('${p.id}')">Apply for this project</button>`:'<button class="btn alt" disabled>Coming Soon — applications closed</button>'}</div>${nav("projects")}`}
function account(){return `${topBar("Account")}<div class="wrap"><div id="acct" class="card">Loading…</div></div>${nav("account")}`}
async function accountFill(){try{const b=await api("/account/balance"),r=await api("/recordings/my");document.getElementById("acct").innerHTML=`<h2>Balance</h2><div class="balance">${money(b.balance_usd)}</div><p class="muted">Total earned ${money(b.total_earned_usd)} · Paid ${money(b.paid_usd)} · Pending payout ${money(b.pending_payout_usd)}</p><hr><h2>Account holder</h2><p class="muted">Name on file</p><input id="acctname" value="${esc(state.user.full_name)}" disabled><hr><h2>PayPal payout</h2><p class="muted">Minimum payout $10. Enter the amount you want to request.</p><input id="pamt" type="number" min="10" step=".01" placeholder="Amount USD"><input id="pp" type="email" value="${esc(state.user.paypal_email||"")}" placeholder="PayPal email"><p class="muted" style="margin-top:8px">Payments are made every 7 days via PayPal by SOUTHYAI, upon approval.</p><button class="btn" onclick="payout()">Request payout</button><hr><h2>Recent recordings</h2><div class="tablewrap"><table class="table"><tr><th>Date</th><th>Duration</th><th>AI score</th><th>Status</th></tr>${(r.recordings||[]).slice(0,20).map(x=>`<tr><td>${new Date(x.created_at).toLocaleDateString()}</td><td>${(x.duration_ms/1000).toFixed(1)}s</td><td>${x.ai_score||"—"}</td><td>${statusBadge(x.status)}</td></tr>`).join("")||"<tr><td colspan=4>No recordings yet.</td></tr>"}</table></div>`}catch(e){document.getElementById("acct").innerHTML=`<p class="error">${esc(e.message)}</p>`}}
async function payout(){try{const amt=Number(document.getElementById("pamt").value);await api("/payouts/request",{method:"POST",body:JSON.stringify({amount_usd:amt,paypal_email:document.getElementById("pp").value.trim()})});toast("Payout request submitted");accountFill()}catch(e){toast(e.message)}}
async function admin(){if(!state.user?.is_manager){go("#dashboard");return""}const isFounder=state.user.manager_role==="FOUNDER";let d={applications:[],managers:[]},s={users:[]},po={payouts:[]},rc={recordings:[]},tx={tasks:[]};try{d=await api("/admin/applications");rc=await api("/admin/recordings");tx=await api("/admin/transcriptions");if(isFounder){s=await api("/admin/staff");po=await api("/admin/payouts")}}catch(e){if(e.code==="ADMIN_LOCKED"||e.code==="ADMIN_SETUP")return adminLock(e.code==="ADMIN_SETUP");return `${topBar("Admin Dashboard")}<div class="wrap"><div class="card error">${esc(e.message)}</div></div>${nav("admin")}`}const payoutSection=isFounder?`<div class="card"><h2>Payout requests</h2><p class="muted">Only the founder can approve payments, to help prevent fraud. SOUTHYAI pays approved freelancers every 7 days via PayPal. Approving here marks the payment as sent; rejecting refunds the amount back to the freelancer's balance.</p><div class="tablewrap"><table class="table"><tr><th>Freelancer</th><th>Email</th><th>Amount</th><th>PayPal email</th><th>Requested</th><th>Status</th><th>Action</th></tr>${(po.payouts||[]).map(p=>`<tr><td>${esc(p.full_name)}</td><td>${esc(p.email)}</td><td>${money(p.amount_usd)}</td><td>${esc(p.paypal_email)}</td><td>${new Date(p.created_at).toLocaleDateString()}</td><td>${statusBadge(p.status)}</td><td>${p.status==="requested"?`<button class="btn small" onclick="payoutDecision('${p.id}','paid')">Mark paid</button> <button class="btn small danger" onclick="payoutDecision('${p.id}','rejected')">Reject</button>`:"Reviewed"}</td></tr>`).join("")||"<tr><td colspan=7>No payout requests yet.</td></tr>"}</table></div></div>`:`<div class="card"><p class="muted">Payment approval is restricted to the founder account, to help prevent fraud.</p></div>`;const rk=r=>r>=60?`<span class="pill" style="background:#fee2e2;color:#b91c1c">High ${r}</span>`:r>=30?`<span class="pill" style="background:#fef3c7;color:#92400e">Medium ${r}</span>`:`<span class="pill active">Low ${r}</span>`;
const txCard=`<div class="card"><h2>Transcription review</h2><p class="muted">Highest AI risk first. Flags are warnings, not proof: play the audio, read the transcript, then approve or reject.</p><div class="tablewrap"><table class="table"><tr><th>Typist</th><th>Language</th><th>AI risk</th><th>Flags</th><th>Audio and transcript</th><th>Action</th></tr>${(tx.tasks||[]).map(t=>{let f=[];try{f=JSON.parse(t.ai_flags||"[]")}catch(e){}return `<tr><td>${esc(t.full_name||"")}</td><td>${esc(t.language)}</td><td>${rk(t.ai_risk||0)}</td><td>${f.map(esc).join("<br>")||"None"}</td><td><audio controls src="${esc(t.source_audio_url||"")}" style="width:190px"></audio><details><summary>Read transcript</summary><pre style="white-space:pre-wrap">${esc(t.transcript||"")}</pre></details></td><td><button class="btn small" onclick="txDecision('${t.id}','approved')">Approve</button> <button class="btn small danger" onclick="txDecision('${t.id}','rejected')">Reject</button></td></tr>`}).join("")||"<tr><td colspan=6>No transcripts waiting for review.</td></tr>"}</table></div></div>`;
return `${topBar("Admin Dashboard")}<div class="wrap"><div class="hero"><h1>${isFounder?"Founder dashboard":"QA dashboard"}</h1><p>${isFounder?"Everything in one place: payments, staff, applications and quality review.":"Your review queue: applications, audio recordings and transcriptions. Payments and staff details are founder-only."}</p></div>${isFounder?`<div class="card"><h2>Managers</h2><div class="tablewrap"><table class="table"><tr><th>Email</th><th>Role</th><th>Created</th></tr>${d.managers.map(m=>`<tr><td>${esc(m.email)}</td><td><b>${esc(m.role)}</b></td><td>${new Date(m.created_at).toLocaleDateString()}</td></tr>`).join("")}</table></div></div>`:""}${payoutSection}<div class="card"><h2>Audio review</h2><p class="muted">Recordings pass an automatic AI quality score at upload, and pay out immediately based on that score. This is the human QA layer on top — reject a clip here if it shouldn't have passed, and the earned amount is deducted back from the freelancer's balance automatically. Note: playback isn't wired up yet (recordings are private storage) — review is currently based on the AI score/feedback and prompt text below.</p><div class="tablewrap"><table class="table"><tr><th>Freelancer</th><th>Project</th><th>Language</th><th>Prompt</th><th>Duration</th><th>AI score</th><th>Action</th></tr>${(rc.recordings||[]).map(r=>`<tr><td>${esc(r.full_name)}</td><td>${esc(r.project_name)}</td><td>${esc(r.language)}</td><td>${esc(r.text_prompt||"")}</td><td>${(r.duration_ms/1000).toFixed(1)}s</td><td>${r.ai_score||"—"}</td><td><button class="btn small" onclick="recordingDecision('${r.id}','approved')">Approve</button> <button class="btn small danger" onclick="recordingDecision('${r.id}','rejected')">Reject</button></td></tr>`).join("")||"<tr><td colspan=7>No recordings awaiting review.</td></tr>"}</table></div></div>${txCard}<div class="card"><h2>All Applications</h2><div class="tablewrap"><table class="table"><tr><th>Freelancer</th><th>Email</th><th>Project</th><th>Rate</th><th>Status</th><th>Action</th></tr>${d.applications.map(a=>`<tr><td>${esc(a.full_name)}</td><td>${esc(a.email)}</td><td>${esc(a.project_name)}</td><td>${money(a.hourly_rate_usd)}/hr</td><td>${statusBadge(a.status)}</td><td>${a.status==="pending"?`<button class="btn small" onclick="decision('${a.id}','approved')">Approve</button> <button class="btn small danger" onclick="decision('${a.id}','rejected')">Reject</button>`:"Reviewed"}</td></tr>`).join("")||"<tr><td colspan=6>No applications yet.</td></tr>"}</table></div></div>${isFounder?`<div class="card"><h2>Staff & referrals</h2><p class="muted">Referral counts and earnings are shown here so payouts can be verified correctly. Contract must be marked signed before a freelancer can start recording, even after approval.</p><div class="tablewrap"><table class="table"><tr><th>Name</th><th>Email</th><th>Referrals</th><th>Referral $ earned</th><th>Balance</th><th>Contract</th><th>Action</th></tr>${(s.users||[]).map(u=>`<tr><td>${esc(u.full_name)}</td><td>${esc(u.email)}</td><td>${u.referral_count||0}</td><td>${money(u.referral_earned_usd||0)}</td><td>${money(u.balance_usd||0)}</td><td>${u.contract_signed?'<span class="pill active">Signed</span>':'<span class="pill">Not signed</span>'}</td><td>${u.contract_signed?"—":`<button class="btn small" onclick="markContract('${u.id}')">Mark signed</button>`} <button class="btn small danger" onclick="mfaReset('${u.id}')">Reset MFA</button></td></tr>`).join("")||"<tr><td colspan=7>No staff yet.</td></tr>"}</table></div></div><div class="card"><h2>Rate & project controls</h2><p class="muted">Active projects are configured at $6/hr and coming-soon projects at $10/hr. Approving an application unlocks the corresponding paid recording rate; earnings are added from valid recordings.</p></div>`:""}</div>${nav("admin")}`}
async function recordingDecision(id,status){try{await api("/admin/recording-decision",{method:"POST",body:JSON.stringify({recording_id:id,status})});render()}catch(e){alert(e.message)}}
async function payoutDecision(id,status){try{await api("/admin/payout-decision",{method:"POST",body:JSON.stringify({payout_id:id,status})});render()}catch(e){alert(e.message)}}
async function markContract(userId){try{await api("/admin/contract",{method:"POST",body:JSON.stringify({user_id:userId})});render()}catch(e){alert(e.message)}}
async function decision(id,status){try{await api("/admin/approve",{method:"POST",body:JSON.stringify({application_id:id,status})});toast(status==="approved"?"Application approved":"Application rejected");render()}catch(e){toast(e.message)}}
function mfaSetupScreen(){return `${topBar("Security")}<div class="wrap"><div class="card narrow"><h2>Turn on two-step login</h2><p class="muted">Your account needs an authenticator app (Google Authenticator, Microsoft Authenticator or Authy) for extra security.</p><div id="mfabox"><button class="btn" onclick="mfaStart()">Start setup</button></div></div></div>`}
async function mfaStart(){try{const d=await api("/auth/mfa/setup",{method:"POST",body:"{}"});document.getElementById("mfabox").innerHTML=`<p>1. In your authenticator app, add an account and choose <b>enter a setup key</b>.</p><p class="muted">Key (name it SOUTHYAI)</p><pre style="user-select:all;word-break:break-all;white-space:pre-wrap">${esc(d.secret)}</pre><p><a href="${esc(d.otpauth)}">On your phone? Tap here to open your authenticator app</a></p><p>2. Type the 6-digit code it shows:</p><input id="mfacode" inputmode="numeric" maxlength="6"><button class="btn" onclick="mfaEnable()">Turn on</button><div id="mfaerr" class="error"></div>`}catch(e){toast(e.message)}}
async function mfaEnable(){try{const d=await api("/auth/mfa/enable",{method:"POST",body:JSON.stringify({code:document.getElementById("mfacode").value})});document.getElementById("mfabox").innerHTML=`<p><b>Save these recovery codes somewhere safe.</b> Each works once if you lose your phone. They won't be shown again.</p><pre style="user-select:all;white-space:pre-wrap">${d.recovery_codes.map(esc).join("\n")}</pre><button class="btn" onclick="go(state.user.is_manager?'#admin':'#dashboard')">I saved them, continue</button>`}catch(e){document.getElementById("mfaerr").textContent=e.message}}
async function mfaReset(id){if(!confirm("Reset two-step login for this person? They will have to set it up again."))return;try{await api("/admin/mfa-reset",{method:"POST",body:JSON.stringify({user_id:id})});toast("Two-step login reset")}catch(e){toast(e.message)}}
const txMeta={};
function txm(id){return txMeta[id]||(txMeta[id]={start:Date.now(),typed:0,pastes:0,heard:new Set()})}
document.addEventListener("timeupdate",e=>{const a=e.target;if(a.tagName==="AUDIO"&&a.dataset.tid&&!a.paused&&!a.seeking)txm(a.dataset.tid).heard.add(Math.floor(a.currentTime))},true);
document.addEventListener("paste",e=>{const c=e.target.closest&&e.target.closest("[id^=txrows-]");if(c)txm(c.id.slice(7)).pastes++},true);
document.addEventListener("input",e=>{const c=e.target.closest&&e.target.closest("[id^=txrows-]");if(c&&e.target.classList.contains("tx-tx")&&e.inputType&&!/paste|drop/i.test(e.inputType))txm(c.id.slice(7)).typed+=e.data?e.data.length:0},true);
async function txDecision(id,status){try{await api("/admin/transcription-decision",{method:"POST",body:JSON.stringify({task_id:id,status})});toast("Saved");render()}catch(e){toast(e.message)}}
function adminLock(setup){return `${topBar("Admin Dashboard")}<div class="wrap"><div class="card" style="max-width:440px;margin:30px auto"><h2>${setup?"Create your admin pass":"Enter your admin pass"}</h2><p class="muted">${setup?"This is a second password just for the Admin area. Use at least 8 characters and make it different from your login password.":"This extra pass keeps Admin safe, even if someone else has your login."}</p><label>Admin pass</label><input id="apass" type="password" autocomplete="off" onkeydown="if(event.key==='Enter')unlockAdmin()"><button class="btn" onclick="unlockAdmin()">${setup?"Save pass and open Admin":"Open Admin"}</button></div></div>${nav("admin")}`}
async function unlockAdmin(){const p=document.getElementById("apass").value;try{await api("/admin/unlock",{method:"POST",body:JSON.stringify({pass:p})});render()}catch(e){toast(e.message)}}
const TX_SPEAKERS=[1,2,3,4,5,6];
function fmtTime(s){s=Math.max(0,Math.floor(s||0));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,p=n=>String(n).padStart(2,"0");return h?`${p(h)}:${p(m)}:${p(x)}`:`${p(m)}:${p(x)}`}
function txRow(ts,sp){return `<div class="row txrow" style="align-items:center"><select class="tx-sp" style="width:120px;margin:0">${TX_SPEAKERS.map(n=>`<option${n==sp?" selected":""}>Speaker ${n}</option>`).join("")}</select><input class="tx-ts" value="${ts||""}" placeholder="00:00" inputmode="numeric" style="width:84px;margin:0"><button type="button" class="btn alt small" onclick="stampTx(this)">⏱ Stamp</button><input class="tx-tx" placeholder="What they said…" style="flex:1 1 220px;width:auto;margin:0"><button type="button" class="btn alt small" onclick="this.parentElement.remove()">✕</button></div>`}
function stampTx(b){const a=b.closest(".card").querySelector("audio");b.parentElement.querySelector(".tx-ts").value=fmtTime(a&&a.currentTime)}
function addTxRow(id){const c=document.getElementById("txrows-"+id),a=c.closest(".card").querySelector("audio"),last=[...c.querySelectorAll(".tx-sp")].pop(),sp=last?(Number(last.value.replace("Speaker ",""))||1):1;c.insertAdjacentHTML("beforeend",txRow(fmtTime(a&&a.currentTime),sp))}
async function transcription(){const lang=new URLSearchParams((location.hash.split("?")[1])||"").get("lang")||state.user.home_language||"english_za";let tasks=[];try{tasks=(await api("/transcription/tasks?language="+encodeURIComponent(lang))).tasks||[]}catch(e){}return `${topBar("Transcription")}<div class="wrap"><div class="hero"><h1>Transcription</h1><p>Play the audio and type what is said, one line per speaker turn. Tap ⏱ Stamp to copy the time from the audio. Each line is saved like this: Speaker 1 [00:12]: text</p></div><div class="card"><h3>Language</h3><select onchange="go('#transcription?lang='+this.value)">${LANGS.map(x=>`<option value="${x[0]}"${x[0]===lang?" selected":""}>${x[1]}</option>`).join("")}</select></div>${tasks.map(t=>`<div class="card"><h3>Task ${esc(t.id)}</h3><audio controls data-tid="${esc(t.id)}" src="${esc(t.source_audio_url||"")}" style="width:100%"></audio><div id="txrows-${esc(t.id)}" style="display:grid;gap:10px;margin:12px 0">${txRow("00:00",1)}</div><div class="row"><button type="button" class="btn alt" onclick="addTxRow('${esc(t.id)}')">+ Add line</button><button class="btn" onclick="submitTx('${esc(t.id)}')">Submit for QA</button></div></div>`).join("")||'<div class="card"><p class="muted">No transcription tasks are available for this language yet.</p></div>'}</div>${nav("transcription")}`}
async function submitTx(id){const rows=[...document.querySelectorAll("#txrows-"+id+" .txrow")],out=[];for(const r of rows){const tx=r.querySelector(".tx-tx").value.replace(/\s+/g," ").trim();if(!tx)continue;let ts=r.querySelector(".tx-ts").value.trim();if(!/^\d{1,2}:\d{2}(:\d{2})?$/.test(ts))return toast("Fix the time on: "+tx.slice(0,25)+" (use 00:12)");ts=ts.split(":").map(n=>n.padStart(2,"0")).join(":");out.push(`${r.querySelector(".tx-sp").value} [${ts}]: ${tx}`)}if(!out.length)return toast("Add at least one line");const au=document.getElementById("txrows-"+id).closest(".card").querySelector("audio"),m=txm(id),meta={duration_sec:au&&isFinite(au.duration)?au.duration:0,played_sec:m.heard.size,elapsed_sec:(Date.now()-m.start)/1000,typed_chars:m.typed,paste_count:m.pastes};try{await api("/transcription/tasks",{method:"POST",body:JSON.stringify({task_id:id,transcript:out.join("\n"),meta})});toast("Submitted for QA");render()}catch(e){toast(e.message)}}
async function record(id,lang){
  const p=state.projects.find(x=>x.id===id)||state.current;
  let apps=[];try{apps=(await api("/applications")).applications||[]}catch(e){}
  const a=apps.find(x=>x.project_id===id);
  const approved=a&&a.status==="approved";
  const canRecord=approved&&p.status==="active";
  if(canRecord&&!state.user.contract_signed){
    setTimeout(()=>nextPrompt(id,lang),0);
    return `${topBar("Recording")}<div class="wrap"><div class="card"><span class="pill active">Approved</span><h2>${esc(p.name)}</h2><div id="prompt" class="prompt">Loading script…</div><div class="notice">✅ You're approved to record for this project. Before you can start earning, please contact your SOUTHYAI admin to complete your induction/training and sign your freelancer contract — this is required before recording opens for your account.</div><button class="btn alt" onclick="go('#dashboard')">Back to dashboard</button></div></div>${nav("dashboard")}`;
  }
  if(!canRecord){
    setTimeout(()=>nextPrompt(id,lang),0);
    const reason=!a?"You haven't applied to this project yet.":a.status!=="approved"?"Your application is still pending manager approval.":"This category is coming soon and isn't open for recording yet.";
    return `${topBar("Recording")}<div class="wrap"><div class="card"><h2>${esc(p.name)}</h2><div id="prompt" class="prompt">Loading script…</div><div class="notice">🔒 Coming soon — ${esc(reason)} You can read the script above now; recording will unlock once this opens.</div><button class="btn alt" onclick="go('#dashboard')">Back to dashboard</button></div></div>${nav("dashboard")}`;
  }
  return `${topBar("Recording")}<div class="wrap"><div class="card" id="recGate"><span class="pill active">Approved</span><h2>${esc(p.name)}</h2><div class="notice"><b>Before you start recording:</b><ul style="margin:8px 0 0 18px;padding:0;line-height:1.6"><li>Use a USB or wired headset mic where possible — not Bluetooth</li><li>Record in a quiet room — no fridge, fan, TV, pets, traffic or music</li><li>Each clip is 1–15 seconds, read naturally at normal pace</li><li>Your audio is collected to train South African language AI models</li></ul></div><label style="display:flex;gap:8px;align-items:flex-start;margin:14px 0"><input type="checkbox" id="consentBox" style="margin-top:3px" onchange="document.getElementById('consentBtn').disabled=!this.checked"><span>I have read the above, I'm recording in a suitable quiet environment, and I consent to this audio being collected and used for AI training as described.</span></label><button class="btn" id="consentBtn" onclick="beginRecording('${id}','${lang}')" disabled>I'm ready — start recording session</button></div></div>${nav("dashboard")}`;
}
async function beginRecording(id,lang){
  if(!document.getElementById("consentBox").checked)return;
  const p=state.projects.find(x=>x.id===id);
  try{const s=await api("/sessions/start",{method:"POST",body:JSON.stringify({project_id:id})});state.session=s.session_id}catch(e){toast(e.message);return}
  state.consented=true;
  document.getElementById("recGate").innerHTML=`<span class="pill active">Approved</span><h2>${esc(p.name)}</h2><div id="prompt" class="prompt">Loading prompt…</div><div id="quality" class="notice">AI audio quality checker ready.</div><div id="rec" class="rec">HOLD TO RECORD</div><div id="play"></div><p id="prog" class="muted">0 clips · $0.00</p><button class="btn alt" onclick="endSession()">End session</button>`;
  bindRecord();
  nextPrompt(id,lang);
}
async function nextPrompt(id,lang){try{const d=await api(`/prompts/next?project_id=${id}&language=${encodeURIComponent(lang)}`);state.prompt=d.prompt;document.getElementById("prompt").textContent=d.prompt.text_prompt}catch(e){document.getElementById("prompt").textContent=e.message}}
let recBusy=false;
function bindRecord(){const el=document.getElementById("rec");if(!el)return;const start=e=>{e.preventDefault();if(recBusy)return;startRec()};const stop=e=>{e.preventDefault();stopRec()};el.addEventListener("pointerdown",start);el.addEventListener("pointerup",stop);el.addEventListener("pointercancel",stop);el.addEventListener("pointerleave",e=>{if(recBusy)stopRec()})}
async function startRec(){if(recBusy)return;recBusy=true;try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});state.stream=stream;state.recorder=new MediaRecorder(stream);state.chunks=[];state.recorder.ondataavailable=e=>e.data.size&&state.chunks.push(e.data);state.recorder.start();state.started=Date.now();document.getElementById("rec").classList.add("on");document.getElementById("rec").textContent="RECORDING…"}catch(e){recBusy=false;toast("Microphone access was denied or unavailable")}}
function stopRec(){if(!recBusy||!state.recorder||state.recorder.state!=="recording")return;const duration=Date.now()-state.started;state.recorder.onstop=()=>{state.stream?.getTracks().forEach(t=>t.stop());state.blob=new Blob(state.chunks,{type:"audio/webm"});state.duration=duration;qualityCheck(state.blob)};state.recorder.stop();document.getElementById("rec").classList.remove("on");document.getElementById("rec").textContent="HOLD TO RECORD"}
async function qualityCheck(blob){const q=await new Promise(resolve=>{const C=window.AudioContext||window.webkitAudioContext;if(!C)return resolve({score:75,ok:true,message:"Browser audio analysis unavailable; QA will review."});const ctx=new C(),fr=new FileReader();fr.onload=async()=>{try{const b=await ctx.decodeAudioData(fr.result),d=b.getChannelData(0),step=Math.max(1,Math.floor(d.length/50000));let sum=0,peak=0,silent=0,n=0;for(let i=0;i<d.length;i+=step){const v=Math.abs(d[i]);sum+=v*v;peak=Math.max(peak,v);if(v<.005)silent++;n++}const rms=Math.sqrt(sum/n),db=20*Math.log10(Math.max(rms,1e-6));let score=100;if(db<-35)score-=30;else if(db<-25)score-=10;if(db>-3)score-=25;if(peak>.99)score-=25;if(silent/n>.75)score-=20;score=Math.max(0,Math.round(score));resolve({score,ok:score>=70,message:score>=70?"Audio level, clipping and silence checks passed.":"Too quiet, clipped or contains too much silence. Please re-record."})}catch(e){resolve({score:70,ok:true,message:"Basic audio check completed; final QA will review."})}};fr.readAsArrayBuffer(blob)});state.quality=q;document.getElementById("quality").innerHTML=`<b>AI Quality Score: ${q.score}/100</b><br>${esc(q.message)}<div style="margin-top:10px"><button class="btn" ${q.ok?"":"disabled"} onclick="saveClip()">Save & next prompt</button> <button class="btn alt" onclick="document.getElementById('play').innerHTML=''">Re-record</button></div>`;document.getElementById("play").innerHTML=`<audio controls src="${URL.createObjectURL(blob)}" style="width:100%;margin-top:10px"></audio>`;recBusy=false}
async function saveClip(){if(!state.blob||!state.prompt||!state.quality?.ok)return;const fd=new FormData();const [id,lang]=recordParams();fd.append("audio",state.blob,"clip.webm");fd.append("project_id",id);fd.append("language",lang);fd.append("text_prompt",state.prompt.text_prompt);fd.append("category",state.prompt.category||"");fd.append("session_id",state.session);fd.append("consent_given",String(!!state.consented));fd.append("duration",String(state.duration));fd.append("ai_score",String(state.quality.score));try{const d=await api("/recordings/upload",{method:"POST",body:fd});state.clips++;state.earned+=Number(d.earned_usd||0);document.getElementById("prog").textContent=`${state.clips} clips · ${money(state.earned)}`;document.getElementById("play").innerHTML="";document.getElementById("quality").textContent=`Saved. AI score ${d.ai_score}/100.`;state.blob=null;await nextPrompt(id,lang);toast(`+${money(d.earned_usd)} earned`)}catch(e){toast(e.message)}}
function recordParams(){const q=new URLSearchParams(location.hash.split("?")[1]||"");return[q.get("project_id"),q.get("language")]}
async function endSession(){try{await api("/sessions/end",{method:"POST",body:JSON.stringify({session_id:state.session})})}catch(e){}go("#account")}
async function render(){const app=document.getElementById("app");let [path,qstr]=location.hash.replace("#","").split("?");const q=new URLSearchParams(qstr||"");if(!path)path=state.user?"dashboard":"landing";if(!state.user&&!["landing","login","signup","projects","project-detail"].includes(path)){go("#landing");return}if(state.user&&["login","signup"].includes(path)){go(state.user.is_manager?"#admin":"#dashboard");return}app.innerHTML='<div class="wrap"><div class="card center">Loading…</div></div>';try{switch(path){case"landing":app.innerHTML=landing();renderLandingProjects();break;case"login":app.innerHTML=login();break;case"signup":app.innerHTML=signup();break;case"dashboard":app.innerHTML=await dashboard();break;case"projects":app.innerHTML=await projects();break;case"project-detail":app.innerHTML=await projectDetail(q.get("id"));break;case"referrals":app.innerHTML=await referrals();break;case"account":app.innerHTML=account();setTimeout(accountFill,0);break;case"admin":app.innerHTML=await admin();break;case"transcription":app.innerHTML=await transcription();break;case"mfa-setup":app.innerHTML=mfaSetupScreen();break;case"record":app.innerHTML=await record(q.get("project_id"),q.get("language"));setTimeout(bindRecord,0);break;default:app.innerHTML=landing();renderLandingProjects()}}catch(e){app.innerHTML=`${topBar()}<div class="wrap"><div class="card error">${esc(e.message)}</div></div>${nav()}`}app.innerHTML+=footer()}
window.addEventListener("hashchange",render);window.addEventListener("load",async()=>{if(state.token){try{const d=await api("/auth");setAuth({token:state.token,user:d.user})}catch(e){localStorage.removeItem("southy_token");localStorage.removeItem("southy_user");state.token="";state.user=null}}render()});
</script></body></html>
